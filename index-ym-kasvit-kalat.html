<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luontovisa - Tunnista kasvit ja kalat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #2c3e50; }
        #game-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #image-container {
            width: 100%;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #e9ecef;
            position: relative;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            position: absolute;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #question-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            border-radius: 10px;
            display: none;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover:not(:disabled) { background-color: #2980b9; }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            color: #ecf0f1;
        }
        button.correct { background-color: #2ecc71 !important; color: white !important; }
        button.wrong { background-color: #e74c3c !important; color: white !important; }
        #feedback { font-size: 20px; font-weight: bold; min-height: 30px; margin-bottom: 15px; }
        #next-btn {
            background-color: #f39c12;
            display: none;
            width: 100%;
            margin-top: 15px;
        }
        .stats { margin-top: 20px; font-size: 18px; color: #7f8c8d; }
        #round-info { margin-bottom: 10px; font-style: italic; color: #95a5a6; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>🌱 Luontovisa 🐟</h1>
        <div id="round-info">Lataa...</div>
        
        <div id="image-container">
            <div class="loader" id="loader"></div>
            <img id="question-image" src="" alt="Arvuutettava laji" crossorigin="anonymous">
        </div>

        <div id="feedback"></div>

        <div class="options" id="options-container"></div>

        <button id="next-btn" onclick="seuraavaKysymys()">Seuraava kysymys ➔</button>

        <div class="stats">
            Pisteet: <span id="score">0</span> / <span id="total">0</span>
        </div>
    </div>

    <script>
        // Tietokanta. Jos Wikipedian API pettää, käytetään "varakuva" -linkkiä.
        const lajit = [
            // Kasvit
            { nimi: "Paju", haku: "Pajut", kategoria: "kasvi" },
            { nimi: "Osmankäämi", haku: "Osmankäämit", kategoria: "kasvi" },
            { nimi: "Järviruoko", haku: "Järviruoko", kategoria: "kasvi" },
            { nimi: "Ulpukka", haku: "Ulpukat", kategoria: "kasvi" },
            { nimi: "Lumme", haku: "Lumpeet", kategoria: "kasvi" },
            { nimi: "Ahvenvita", haku: "Ahvenvita", kategoria: "kasvi" },
            
            // Kalat
            { nimi: "Särki", haku: "Särki", kategoria: "kala" },
            { nimi: "Ahven", haku: "Ahven", kategoria: "kala" },
            { nimi: "Hauki", haku: "Hauki", kategoria: "kala" },
            { nimi: "Lohi", haku: "Lohi", kategoria: "kala" },
            { nimi: "Silakka", haku: "Silakka", kategoria: "kala" },
            // Muikun artikkeli rikki Wikipediassa -> annetaan sille manuaalinen varakuva ohitusta varten
            { nimi: "Muikku", haku: "Muikku", kategoria: "kala", varakuva: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Coregonus_albula.jpg/1920px-Coregonus_albula.jpg" }
        ];

        let pakka = []; 
        let nykyinenLaji;
        let pisteet = 0;
        let kysymyksiaVastattu = 0;

        // Harmaa vararuutu, jos kaikki verkkoyhteydet kaatuvat
        const errorImage = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='400'%3E%3Crect width='100%25' height='100%25' fill='%23e9ecef'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='24' fill='%237f8c8d'%3EKuvaa ei voitu ladata%3C/text%3E%3C/svg%3E";

        function sekoita(array) {
            let uusi = [...array];
            for (let i = uusi.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [uusi[i], uusi[j]] = [uusi[j], uusi[i]];
            }
            return uusi;
        }

        function nollaaPakka() {
            pakka = sekoita(lajit);
        }

        async function haeWikipediaKuva(lajiKokonaisuus) {
            const url = `https://fi.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(lajiKokonaisuus.haku)}&redirects=1&prop=pageimages&format=json&pithumbsize=800&origin=*`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                const pages = data.query.pages;
                const pageId = Object.keys(pages);
                
                // Onko sivulla kuva (thumbnail)?
                if (pages[pageId] && pages[pageId].thumbnail) {
                    return pages[pageId].thumbnail.source;
                } else if (lajiKokonaisuus.varakuva) {
                    // Jos API pettää (kuten Muikun tapauksessa), käytetään tietokannan varakuvaa
                    console.log(`API ei löytänyt kuvaa lajille ${lajiKokonaisuus.nimi}, käytetään varakuvaa.`);
                    return lajiKokonaisuus.varakuva;
                }
            } catch (e) {
                console.error("Virhe Wikipedian API:n kanssa:", e);
            }
            return errorImage;
        }

        async function seuraavaKysymys() {
            if (pakka.length === 0) {
                nollaaPakka();
            }

            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').style.display = "none";
            
            const kuvaElementti = document.getElementById('question-image');
            const latausAnimaatio = document.getElementById('loader');
            const napitContainer = document.getElementById('options-container');
            
            kuvaElementti.style.display = "none";
            latausAnimaatio.style.display = "block";
            napitContainer.innerHTML = "";
            
            nykyinenLaji = pakka.pop();

            const monesko = lajit.length - pakka.length;
            document.getElementById('round-info').innerText = `Laji ${monesko} / ${lajit.length}`;
            
            // Viedään koko laji-objekti funktiolle, jotta se näkee mahdollisen varakuvan
            const kuvaUrl = await haeWikipediaKuva(nykyinenLaji);
            kuvaElementti.src = kuvaUrl;
            
            kuvaElementti.onload = () => {
                latausAnimaatio.style.display = "none";
                kuvaElementti.style.display = "block";
                luoVastauspainikkeet();
            };

            kuvaElementti.onerror = () => {
                kuvaElementti.src = errorImage;
                latausAnimaatio.style.display = "none";
                kuvaElementti.style.display = "block";
                luoVastauspainikkeet();
            };
        }

        function luoVastauspainikkeet() {
            const container = document.getElementById('options-container');
            
            let hämäykset = lajit.filter(l => l.kategoria === nykyinenLaji.kategoria && l.nimi !== nykyinenLaji.nimi);
            hämäykset = sekoita(hämäykset).slice(0, 3);
            
            let vaihtoehdot = sekoita([nykyinenLaji, ...hämäykset]); 

            vaihtoehdot.forEach(vaihtoehto => {
                const btn = document.createElement('button');
                btn.innerText = vaihtoehto.nimi;
                btn.onclick = () => tarkistaVastaus(btn, vaihtoehto.nimi);
                container.appendChild(btn);
            });
        }

        function tarkistaVastaus(nappi, vastattuNimi) {
            const napit = document.querySelectorAll('.options button');
            napit.forEach(n => n.disabled = true);

            kysymyksiaVastattu++;
            const feedbackEl = document.getElementById('feedback');

            if (vastattuNimi === nykyinenLaji.nimi) {
                nappi.classList.add('correct');
                feedbackEl.innerText = "⭐ Oikein!";
                feedbackEl.style.color = "#27ae60";
                pisteet++;
            } else {
                nappi.classList.add('wrong');
                feedbackEl.innerText = `Väärin, se oli ${nykyinenLaji.nimi}.`;
                feedbackEl.style.color = "#c0392b";
                napit.forEach(n => {
                    if (n.innerText === nykyinenLaji.nimi) n.classList.add('correct');
                });
            }

            document.getElementById('score').innerText = pisteet;
            document.getElementById('total').innerText = kysymyksiaVastattu;
            document.getElementById('next-btn').style.display = "block";
            
            if (pakka.length === 0) {
                document.getElementById('next-btn').innerText = "Kierros loppui! Aloita uusi ➔";
            } else {
                document.getElementById('next-btn').innerText = "Seuraava kysymys ➔";
            }
        }

        window.onload = () => {
            nollaaPakka();
            seuraavaKysymys();
        };
    </script>
</body>
</html>
